version: 1
disable_existing_loggers: false

# ---------- formatters ----------
formatters:
  concise:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

# ---------- custom filters (one per level) ----------
filters:
  only_debug:    { (): src.utils.logger.OnlyLevelFilter, level: DEBUG     }
  only_info:     { (): src.utils.logger.OnlyLevelFilter, level: INFO      }
  only_warning:  { (): src.utils.logger.OnlyLevelFilter, level: WARNING   }
  only_error:    { (): src.utils.logger.OnlyLevelFilter, level: ERROR     }
  only_critical: { (): src.utils.logger.OnlyLevelFilter, level: CRITICAL  }

# ---------- handlers ----------
handlers:
  debug_file:
    class: logging.handlers.TimedRotatingFileHandler            # Borrado diario
    level: DEBUG
    formatter: concise
    filename: logs/debug.log
    when: midnight
    backupCount: 1                                              #
    filters: [only_debug]

  info_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: concise
    filename: logs/info.log
    maxBytes: 10485760                                          # 10 MiB
    backupCount: 7
    filters: [only_info]

  warning_file:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: concise
    filename: logs/warning.log
    maxBytes: 10485760
    backupCount: 7
    filters: [only_warning]

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: concise
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 14
    filters: [only_error]

  critical_file:
    class: logging.handlers.RotatingFileHandler
    level: CRITICAL
    formatter: concise
    filename: logs/critical.log
    maxBytes: 10485760
    backupCount: 30
    filters: [only_critical]

  console:
    class: logging.StreamHandler                                # dev convenience
    level: INFO
    formatter: concise

# ---------- root logger ----------
root:
  level: DEBUG
  handlers: [console, debug_file, info_file, warning_file, error_file, critical_file]
